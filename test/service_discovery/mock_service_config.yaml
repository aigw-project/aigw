apiVersion: v1
kind: ConfigMap
metadatta:
  name: mock-llm-script
  namespace: default
data:
  mock_llm.py: |
    import json
    import time
    import logging
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from urllib.parse import urlparse

    logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(name)s - %(levelname)s - %(message)s')

    class LLMMockHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            parsed_path = urlparse(self.path)
            if parsed_path.path != '/v1/chat/completions':
                self.send_response(404)
                self.end_headers()
                return

            content_length = int(self.headers.get('Content-Length', 0))
            request_data = self.rfile.read(content_length)

            try:
                request_json = json.loads(request_data.decode('utf-8'))
                logging.info(f"Pod: {self.server.server_name} - Received: {request_json}")

                timestamp = int(time.time())
                response = {
                    "id": f"chatcmpl-{timestamp}",
                    "object": "chat.completion",
                    "created": timestamp,
                    "model": request_json.get("model", "qwen3"),
                    "choices": [{
                        "index": 0,
                        "message": {
                            "role": "assistant",
                            "content": f"Welcome to AIGW {timestamp}"
                        },
                        "finish_reason": "stop"
                    }],
                    "usage": {
                        "prompt_tokens": 0,
                        "completion_tokens": 0,
                        "total_tokens": 0
                    }
                }
                logging.info(f"Pod: {self.server.server_name} - Response: {response}")

                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Access-Control-Allow-Origin', '*')
                self.end_headers()
                self.wfile.write(json.dumps(response).encode('utf-8'))
            except Exception as e:
                logging.error(f"Error: {e}")
                self.send_response(500)
                self.end_headers()

        def do_GET(self):
            parsed_path = urlparse(self.path)
            if parsed_path.path == '/health':
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({"status": "healthy"}).encode('utf-8'))
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            logging.info("%s - - [%s] %s" % (
                self.client_address[0],
                self.log_date_time_string(),
                format % args
            ))

    if __name__ == '__main__':
        server = HTTPServer(('0.0.0.0', 10240), LLMMockHandler)
        logging.info("Mock LLM server starting on 0.0.0.0:10240")
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            server.shutdown()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-mock
  namespace: default
  labels:
    app: qwen3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qwen3
  template:
    metadata:
      labels:
        app: qwen3
    spec:
      containers:
      - name: llm-mock
        image: aigw-image/mock-llm:v1
        command: ["python", "/app/mock_llm.py"]
        ports:
        - containerPort: 10240
        volumeMounts:
        - name: script
          mountPath: /app
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
        readinessProbe:
          httpGet:
            path: /health
            port: 10240
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: script
        configMap:
          name: mock-llm-script

---
apiVersion: v1
kind: Service
metadata:
  name: qwen3
  namespace: default
  labels:
    app: qwen3
spec:
  ports:
  - name: http
    port: 10240
    protocol: TCP
    targetPort: 10240
  selector:
    app: qwen3
  type: ClusterIP